<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="claude:viewport-fit-sides" content="cover">
  <title>Tim Malaise Portfolio</title>
  <meta name="description" content="Portfolio of Tim Malaise: stage lighting programming and software development.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
  <a class="skip" href="#main-content" data-i18n="skip">Skip to content</a>

  <header class="bar" id="top">
    <a class="brand" href="#top" id="brand">Tim Malaise</a>
    <nav class="nav" id="nav" aria-label="Main">
      <a href="#light" data-i18n="nav.light"></a>
      <a href="#code" data-i18n="nav.code"></a>
      <a href="#about" data-i18n="nav.about"></a>
      <a href="#contact" data-i18n="nav.contact"></a>
    </nav>
    <div class="bar-tools">
      <div class="temp" aria-hidden="true"><span class="temp-bar"><i id="temp-mark"></i></span><output id="kelvin">3200
          K</output></div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="fr" aria-pressed="false">FR</button>
      </div>
      <button type="button" class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="nav"
        data-i18n="menu">Menu</button>
    </div>
  </header>

  <main id="main-content">
    <section class="hero" aria-labelledby="name">
      <canvas id="rig" aria-hidden="true"></canvas>
      <div class="wrap hero-inner">
        <p class="hero-role" id="hero-role"></p>
        <h1 class="name" id="name"></h1>
        <div class="hero-foot">
          <div class="hero-copy">
            <p class="hero-statement" id="hero-statement"></p>
            <p class="hero-avail" id="hero-avail"></p>
          </div>
          <button class="tap" id="tap" type="button">
            <span class="tap-dot" id="tap-dot" aria-hidden="true"></span>
            <span class="tap-bpm"><output id="bpm">120</output> BPM</span>
            <span class="tap-label" data-i18n="tap"></span>
          </button>
        </div>
      </div>
    </section>

    <div class="ticker" aria-hidden="true">
      <div class="ticker-track" id="ticker"></div>
    </div>

    <section class="sec" id="light" data-zone="light">
      <div class="wrap">
        <div class="sec-head">
          <h2 class="h2" data-i18n="light.title"></h2>
          <p class="sec-intro" data-i18n="light.intro"></p>
        </div>
        <div class="filters" id="light-filters" role="group" aria-label="Filter"></div>
        <div class="cues-head" aria-hidden="true">
          <span data-i18n="col.cue"></span><span data-i18n="col.event"></span><span data-i18n="col.type"></span><span
            data-i18n="col.where"></span><span data-i18n="col.role"></span>
        </div>
        <ol class="cues" id="light-list"></ol>
      </div>
    </section>

    <section class="sec" id="code" data-zone="code">
      <div class="wrap">
        <div class="sec-head">
          <h2 class="h2" data-i18n="code.title"></h2>
          <p class="sec-intro" data-i18n="code.intro"></p>
        </div>
        <div class="filters" id="code-filters" role="group" aria-label="Filter"></div>
        <div class="cards" id="code-list"></div>
      </div>
    </section>

    <section class="sec" id="about">
      <div class="wrap">
        <div class="sec-head">
          <h2 class="h2" data-i18n="about.title"></h2>
        </div>
        <div class="about-grid">
          <div class="bio" id="about-bio"></div>
          <div class="skills" id="about-skills"></div>
        </div>
        <div class="looking" id="looking"></div>
      </div>
    </section>

    <section class="sec" id="contact">
      <div class="wrap">
        <div class="sec-head">
          <h2 class="h2" data-i18n="contact.title"></h2>
          <p class="sec-intro" data-i18n="contact.intro"></p>
        </div>
        <div class="contact" id="contact-body"></div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <div class="wrap foot-in"><span id="foot-left"></span><button type="button" class="linkish" id="to-top"
        data-i18n="top"></button></div>
  </footer>

  <div class="case" id="case" role="dialog" aria-modal="true" hidden></div>

  <div class="lb" id="lb" role="dialog" aria-modal="true" hidden>
    <button type="button" class="lb-btn lb-x" id="lb-x">×</button>
    <button type="button" class="lb-btn lb-prev" id="lb-prev">‹</button>
    <div class="lb-stage" id="lb-stage"></div>
    <button type="button" class="lb-btn lb-next" id="lb-next">›</button>
    <p class="lb-cap" id="lb-cap"></p>
  </div>

  <div class="peek" id="peek" aria-hidden="true"></div>
  <div class="cursor" id="cursor" aria-hidden="true"><span></span></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <p style="padding:24px">This portfolio needs JavaScript to display its content.</p>
  </noscript>
  <script src="data/content.js"></script>
  <script src="assets/js/art.js"></script>
  <script src="assets/js/beams.js"></script>
  <script src="assets/js/main.js"></script>
</body>

</html>
